apiVersion: apps/v1
kind: Deployment
metadata:
  name: blutag-website
spec:
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: blutag-website
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /run
        command:
        - nginx
        args:
        - -g
        - daemon off;
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 16Mi
      - name: nginx-cache
        emptyDir:
          sizeLimit: 32Mi
      - name: nginx-run
        emptyDir:
          sizeLimit: 1Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
