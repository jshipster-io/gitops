apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-ids
  labels:
    app: pg-backup
    database: ids
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pg-backup
            database: ids
            azure.workload.identity/use: 'true'
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: pg-dump
            image: postgres:17-alpine
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              TIMESTAMP=$(date +%Y-%m-%d)
              ARCHIVE_FILE="/backups/ids_embeddings-${TIMESTAMP}.sql.gz"
              DUMP_PIPE="/backups/.ids-${TIMESTAMP}.pipe"
              echo "Backing up ids_embeddings..."
              mkfifo "${DUMP_PIPE}"
              gzip -c < "${DUMP_PIPE}" > "${ARCHIVE_FILE}" &
              GZIP_PID=$!
              if pg_dump -h shared-postgres.postgres.svc.cluster.local -p 5432 -U "${PGUSER}" -d ids_embeddings --no-password --file "${DUMP_PIPE}"; then
                DUMP_STATUS=0
              else
                DUMP_STATUS=$?
              fi
              if wait "${GZIP_PID}"; then
                GZIP_STATUS=0
              else
                GZIP_STATUS=$?
              fi
              rm -f "${DUMP_PIPE}"
              test "${DUMP_STATUS}" -eq 0
              test "${GZIP_STATUS}" -eq 0
              test -s "${ARCHIVE_FILE}"
              gzip -t "${ARCHIVE_FILE}"
              gzip -cd "${ARCHIVE_FILE}" | tail -20 | grep -q '^-- PostgreSQL database dump complete'
              echo "Backup validated: $(du -h "${ARCHIVE_FILE}" | cut -f1)"
            env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secrets
                  key: IDS_PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secrets
                  key: IDS_PGPASSWORD
            volumeMounts:
            - name: backup-data
              mountPath: /backups
            resources:
              requests:
                memory: "64Mi"
                cpu: "10m"
              limits:
                memory: "256Mi"
                cpu: "200m"
          containers:
          - name: upload
            image: mcr.microsoft.com/azure-cli:2.91.0@sha256:933eb8dcb81aecb6f77e03c5b8660f0a1dfa9e1d16525763a27f86ff3b83a044
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -e
              python3.12 /var/run/azure-workload-login/login.py
              set -e
              TIMESTAMP=$(date +%Y-%m-%d)
              FILENAME="ids_embeddings-${TIMESTAMP}.sql.gz"
              echo "Uploading to pg-backups/ids_embeddings/${TIMESTAMP}.sql.gz..."
              az storage blob upload \
                --account-name "${AZURE_STORAGE_ACCOUNT}" \
                --auth-mode login \
                --container-name pg-backups \
                --name "ids_embeddings/${TIMESTAMP}.sql.gz" \
                --file "/backups/${FILENAME}" \
                --overwrite true
              echo "Upload complete."
            env:
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secrets
                  key: AZURE_STORAGE_ACCOUNT
            - name: AZURE_CONFIG_DIR
              value: /tmp/azure
            - name: AZURE_STORAGE_AUTH_MODE
              value: login
            - name: PYTHONPATH
              value: /usr/lib64/az/lib/python3.12/site-packages
            volumeMounts:
            - name: backup-data
              mountPath: /backups
            - name: azure-workload-login
              mountPath: /var/run/azure-workload-login
              readOnly: true
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "512Mi"
                cpu: "100m"
          volumes:
          - name: backup-data
            emptyDir:
              sizeLimit: 1Gi
          - name: azure-workload-login
            configMap:
              name: azure-workload-login
              defaultMode: 292
          serviceAccountName: pg-backups
