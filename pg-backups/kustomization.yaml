apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob-tivtaam-mcp.yaml
  - cronjob-webtop-mcp.yaml
  - cronjob-mashov-mcp.yaml
  - cronjob-multi-whatsapp.yaml
  - cronjob-ids.yaml
  - cronjob-dirtbike.yaml
  - cronjob-hasadnaa.yaml
  # - cronjob-genrag.yaml
  - cronjob-blutag.yaml
  - cronjob-trainings.yaml
  # Retained ANPR data remains protected after application retirement.
  - cronjob-anpr.yaml

