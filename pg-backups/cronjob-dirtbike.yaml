apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-dirtbike
  labels:
    app: pg-backup
    database: dirtbike
spec:
  schedule: "15 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: pg-backup
            database: dirtbike
            azure.workload.identity/use: 'true'
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: pg-dump
            image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              TIMESTAMP=$(date +%Y-%m-%d)
              SQL_FILE="/backups/dirtbike-${TIMESTAMP}.sql"
              ARCHIVE_FILE="${SQL_FILE}.gz"
              echo "Backing up dirtbike..."
              pg_dump -h shared-postgres.postgres.svc.cluster.local -p 5432 -U "${PGUSER}" -d dirtbike --no-password --file "${SQL_FILE}"
              test -s "${SQL_FILE}"
              gzip "${SQL_FILE}"
              gzip -t "${ARCHIVE_FILE}"
              gzip -cd "${ARCHIVE_FILE}" | tail -20 | grep -q '^-- PostgreSQL database dump complete'
              echo "Backup validated: $(du -h "${ARCHIVE_FILE}" | cut -f1)"
            env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secrets
                  key: DIRTBIKE_PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secrets
                  key: DIRTBIKE_PGPASSWORD
            volumeMounts:
            - name: backup-data
              mountPath: /backups
            resources:
              requests:
                memory: "64Mi"
                cpu: "10m"
              limits:
                memory: "256Mi"
                cpu: "200m"
          containers:
          - name: upload
            image: mcr.microsoft.com/azure-cli:latest
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -e
              python3 /var/run/azure-workload-login/login.py
              set -e
              TIMESTAMP=$(date +%Y-%m-%d)
              FILENAME="dirtbike-${TIMESTAMP}.sql.gz"
              echo "Uploading to pg-backups/dirtbike/${TIMESTAMP}.sql.gz..."
              az storage blob upload \
                --account-name "${AZURE_STORAGE_ACCOUNT}" \
                --auth-mode login \
                --container-name pg-backups \
                --name "dirtbike/${TIMESTAMP}.sql.gz" \
                --file "/backups/${FILENAME}" \
                --overwrite true
              echo "Upload complete."
            env:
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: pg-backup-secrets
                  key: AZURE_STORAGE_ACCOUNT
            - name: AZURE_CONFIG_DIR
              value: /tmp/azure
            - name: AZURE_STORAGE_AUTH_MODE
              value: login
            volumeMounts:
            - name: backup-data
              mountPath: /backups
            - name: azure-workload-login
              mountPath: /var/run/azure-workload-login
              readOnly: true
            resources:
              requests:
                memory: "32Mi"
                cpu: "10m"
              limits:
                memory: "512Mi"
                cpu: "100m"
          volumes:
          - name: backup-data
            emptyDir:
              sizeLimit: 1Gi
          - name: azure-workload-login
            configMap:
              name: azure-workload-login
              defaultMode: 292
          serviceAccountName: pg-backups
