apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-workload-login
data:
  login.py: |
    import os
    from pathlib import Path
    from azure.cli.core import get_default_cli
    # Pass the projected assertion inside this process, never through OS argv.
    assertion = Path(os.environ["AZURE_FEDERATED_TOKEN_FILE"]).read_text()
    result = get_default_cli().invoke([
        "login", "--service-principal", "--username", os.environ["AZURE_CLIENT_ID"],
        "--tenant", os.environ["AZURE_TENANT_ID"], "--federated-token", assertion,
        "--allow-no-subscriptions", "--output", "none", "--only-show-errors",
    ])
    if result:
        raise SystemExit(result)
