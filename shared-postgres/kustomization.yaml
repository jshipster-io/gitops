apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - network-policy.yaml
  - namespace.yaml
  - bootstrap-configmap.yaml
  - tls-certificates.yaml
  - statefulset.yaml
  - statefulset-18.yaml
  - backup-recovery-cronjob.yaml
  - workload-identity-backup.yaml
  - workload-identity-login.yaml
  - service.yaml
  # Bootstrap is manual: automatic execution overwrites restored credentials.
  - optional-tls-reload-cronjob.yaml

generators:
  - secrets-generator.yaml
