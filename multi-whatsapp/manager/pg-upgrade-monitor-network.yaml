apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-upgrade-monitor-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: multi-whatsapp-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: jshipster
      podSelector:
        matchLabels:
          app: pg-upgrade-monitor
    ports:
    - protocol: TCP
      port: 8080
