apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pod-security
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jshipster-io/gitops.git
    targetRevision: production
    path: pod-security
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
