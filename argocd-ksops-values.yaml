# ArgoCD Helm values for KSOPS (SOPS decryption) support
# This configuration adds KSOPS plugin to ArgoCD repo-server
# allowing automatic decryption of SOPS-encrypted secrets
# 
# Versions:
# - ArgoCD: v3.5.6 security rebuild (Helm chart 10.11.6)
# - KSOPS: v4.5.1 security rebuild (native install; no shell required)

# CI owns both digest pins; update argocd-images inputs to build a new pair.
# Retain the stable release's list-pager nil-pointer fix (#25192).
global:
  # Fine-grained ingress and egress policies are managed by GitOps instead.
  # Helm's server ingress rule otherwise permits every source additively.
  networkPolicy:
    create: false
  image:
    repository: prodacr1234.azurecr.io/platform-argocd
    tag: 52a006bd77fa32cb7ab356795b538af176160d6d@sha256:75906d931dc8066c3d94fd727c0e6cdae65ef2e3dd903c0ef4954e2afba74109

controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  env:
    - name: GOMEMLIMIT
      value: 768MiB

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

server:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  # The bounded two-node pool has no surge slot. Running apps and the API remain
  # available, while manifest rendering briefly pauses during singleton updates.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # Rendering uses repository credentials over RPC, not the Kubernetes API.
  automountServiceAccountToken: false
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 384Mi
  # Add volumes for custom tools and SOPS age key
  volumes:
    - name: custom-tools
      emptyDir:
        sizeLimit: 64Mi
    - name: sops-age
      secret:
        secretName: sops-age
  
  # Distroless KSOPS installs itself into the writable shared volume.
  # Keep Argo CD's bundled Kustomize; replace only the decryption plugin.
  initContainers:
    - name: install-ksops
      image: prodacr1234.azurecr.io/platform-ksops@sha256:30336b7f0b2583de4fc9d78fc8b30451cf6e768f43dbf09ac18dcc8b2d22d2be
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools

  # Mount custom tools and SOPS key in the main container
  volumeMounts:
    - mountPath: /home/argocd/.config/kustomize/plugin/viaduct.ai/v1/ksops/ksops
      name: custom-tools
      subPath: ksops
      readOnly: true
    - mountPath: /.config/sops/age
      name: sops-age
      readOnly: true
  
  # Environment variables for SOPS
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
    - name: KUSTOMIZE_PLUGIN_HOME
      value: /home/argocd/.config/kustomize/plugin

# Enable exec for kustomize (required for KSOPS)
configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

# ArgoCD Notifications — Slack delivery of application sync/deploy events to the
# #deployments channel. This codifies what previously lived only in-cluster as
# the argocd-notifications-cm so the routing is version-controlled.
#
# Normal delivery uses apps/argocd.yaml and the self-management overlay.
# Helm remains the external recovery path; see docs/argocd-self-management.md.
# The Slack credentials already live in the existing argocd-notifications-secret
# (keys: slack-token, slack-webhook-url), so we do not recreate it here.
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  enabled: true
  secret:
    create: false
  notifiers:
    service.slack: |
      token: $slack-token
      webhook: $slack-webhook-url
      username: ArgoCD
      icon: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
  subscriptions:
    - recipients:
        - slack:#deployments
      triggers:
        - on-created
        - on-deleted
        - on-sync-succeeded
        - on-sync-failed
        - on-sync-status-unknown

