apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-tailscale
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for tailscale
  sourceRepos:
  - https://github.com/jshipster-io/gitops.git
  - https://pkgs.tailscale.com/helmcharts
  destinations:
  - server: https://kubernetes.default.svc
    namespace: kube-system
  - server: https://kubernetes.default.svc
    namespace: tailscale
  clusterResourceWhitelist:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: connectors.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: dnsconfigs.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: peerrelays.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: proxyclasses.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: proxygrouppolicies.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: proxygroups.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: recorders.tailscale.com
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: tailnets.tailscale.com
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
    name: tailscale-operator
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
    name: tailscale-operator
  - group: tailscale.com
    kind: Connector
    name: jshipster-aks
  - group: tailscale.com
    kind: ProxyClass
    name: jshipster-resources
  namespaceResourceWhitelist:
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  sourceNamespaces: []
