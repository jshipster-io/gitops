apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-hasadnaa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for hasadnaa
  sourceRepos:
  - https://github.com/jshipster-io/gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: hasadnaa
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
    name: hasadnaa
  namespaceResourceWhitelist:
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  - group: networking.k8s.io
    kind: Ingress
  sourceNamespaces: []
