apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-ids-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for ids-postgres
  sourceRepos:
  - https://github.com/jshipster-io/gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: ids
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: Secret
  sourceNamespaces: []
