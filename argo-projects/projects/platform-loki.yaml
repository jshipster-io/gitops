apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for loki
  sourceRepos:
  - https://github.com/jshipster-io/gitops
  destinations:
  - server: https://kubernetes.default.svc
    namespace: loki
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
    name: loki
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
    name: alloy
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
    name: alloy
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: DaemonSet
  - group: apps
    kind: StatefulSet
  sourceNamespaces: []
