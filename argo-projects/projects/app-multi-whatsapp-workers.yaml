apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-multi-whatsapp-workers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for multi-whatsapp-workers
  sourceRepos:
  - https://github.com/jshipster-io/gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: multi-whatsapp
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: apps
    kind: Deployment
  sourceNamespaces: []
