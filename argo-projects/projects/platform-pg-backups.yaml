apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-pg-backups
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for pg-backups
  sourceRepos:
  - https://github.com/jshipster-io/gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: pg-backups
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: ServiceAccount
  - group: batch
    kind: CronJob
  sourceNamespaces: []
