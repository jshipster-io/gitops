apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Scoped deployment permissions for external-dns
  sourceRepos:
  - https://github.com/jshipster-io/gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: external-dns
  clusterResourceWhitelist:
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
    name: external-dns
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
    name: external-dns
  namespaceResourceWhitelist:
  - group: ''
    kind: Secret
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  sourceNamespaces: []
