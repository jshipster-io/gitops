apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-notifications
spec:
  template:
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: slack-notifications
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 32Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: azure-billing-report
spec:
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: billing-reporter
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            command:
            - /app/slack-notifications
          volumes:
          - name: runtime-tmp
            emptyDir:
              sizeLimit: 32Mi
---
