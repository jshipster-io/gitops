apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-upgrade-monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-upgrade-monitor-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  state.json: '{}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-upgrade-watchdog-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  alerted: 'false'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-upgrade-monitor-state
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - pg-upgrade-monitor-state
  - pg-upgrade-watchdog-state
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-upgrade-monitor-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-upgrade-monitor-state
subjects:
- kind: ServiceAccount
  name: pg-upgrade-monitor
  namespace: jshipster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pg-upgrade-monitor-read
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  resourceNames:
  - shared-postgres-18-0
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
