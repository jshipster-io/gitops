apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-notifications
  labels:
    app: slack-notifications
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: slack-notifications
  template:
    metadata:
      labels:
        app: slack-notifications
    spec:
      serviceAccountName: uptime-check
      automountServiceAccountToken: true
      containers:
      - name: slack-notifications
        image: prodacr1234.azurecr.io/slack-notifications:main-35bf30a
        ports:
        - containerPort: 8080
        env:
        - name: UPTIME_STATE_CONFIGMAP
          value: uptime-health-state
        - name: HASADNAA_REPORT_CHANNEL
          value: C0ALLUTTECT
        - name: BLUTAG_APP_REPORT_CHANNEL
          value: C0A3HT1JXFV
        - name: DRC_REPORT_CHANNEL
          value: C0B93ML2RJQ
        - name: DRC_HEALTH_URL
          value: https://drc-trainings.jshipster.io/api/healthz
        - name: PORT
          value: "8080"
        envFrom:
        - secretRef:
            name: slack-notifications-secrets
        resources:
          requests:
            memory: "12Mi"
            cpu: "5m"
          limits:
            memory: "32Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 2
