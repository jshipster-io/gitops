apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount-azure-backup-reporter.yaml
  - uptime-state.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob.yaml
  - blutag-findmy-status-cronjob.yaml
  - hasadnaa-weekly-summary-cronjob.yaml
  - blutag-weekly-summary-cronjob.yaml
  - pg-backup-report-cronjob.yaml
  - uptime-check-cronjob.yaml
  # DRC (trainings) — backups & uptime are folded into the global per-service
  # fan-out (pg-backup-report / uptime-check); only the business summary is DRC-specific.
  - drc-weekly-summary-cronjob.yaml
  # ANPR retired 2026-10-30; retain the manifest but prune the CronJob.
  # - anpr-weekly-summary-cronjob.yaml
  - serviceaccount.yaml
  # GCP Billing
  - gcp-billing-cronjob.yaml
  - gcp-serviceaccount.yaml

generators:
  - secrets-generator.yaml
  - gcp-secrets-generator.yaml

patches:
  - path: pod-hardening.patch.yaml
  - path: workload-identity-pg-backup-report.patch.yaml
  - path: workload-identity-azure-billing-report.patch.yaml
  - path: workload-identity-slack-notifications.patch.yaml
