apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-health-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  state.json: '{"down":{}}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptime-check
  annotations:
    azure.workload.identity/client-id: "4b0fa0be-5468-4d92-b083-14c6a010dacb"
    azure.workload.identity/tenant-id: "4816ec0c-0a79-49e4-8844-2077c7c79460"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uptime-state
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [uptime-health-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uptime-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uptime-state
subjects:
  - kind: ServiceAccount
    name: uptime-check
    namespace: jshipster
