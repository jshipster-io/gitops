apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pg-upgrade-monitor-rbac.yaml
  - serviceaccount-blutag-app.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml

generators:
  - secrets-generator.yaml

namespace: blutag

commonLabels:
  app: blutag-app

patches:
  - path: workload-identity-blutag-app.patch.yaml
