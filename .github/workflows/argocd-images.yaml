name: Argo CD image security
on:
  push:
    branches: [main]
    paths: ['argocd-images/**', '.github/workflows/argocd-images.yaml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: argocd-images-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [argocd, ksops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 argocd-images/prepare.py
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name prodacr1234 --only-show-errors
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: argocd-images
          file: argocd-images/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: prodacr1234.azurecr.io/platform-${{ matrix.image }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=platform-${{ matrix.image }}
          cache-to: type=gha,scope=platform-${{ matrix.image }},mode=max
      - name: Scan immutable candidate
        env:
          IMAGE: prodacr1234.azurecr.io/platform-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          bash image-security/scan-image.sh "$IMAGE"
          mkdir -p receipts
          printf '%s\n' "$IMAGE" > receipts/${{ matrix.image }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.image }}
          path: receipts/*.txt
          retention-days: 7
  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: image-*
          merge-multiple: true
          path: receipts
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name prodacr1234 --only-show-errors
      - run: sudo apt-get update && sudo apt-get install -y age
      - name: Verify candidate pair without production credentials or network
        run: bash argocd-images/test-runtime.sh "$(cat receipts/argocd.txt)" "$(cat receipts/ksops.txt)"
