name: GitOps validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keep each intake commit queued even if push events arrive out of order.
  # The promotion step still rejects any SHA that is no longer main.
  group: gitops-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    name: gitops-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/pod-security/go.mod
          cache-dependency-path: tools/pod-security/go.sum
      - name: Build official Pod Security evaluator
        working-directory: tools/pod-security
        run: |
          mkdir -p "$RUNNER_TEMP/gitops-tools"
          go test ./...
          go build -o "$RUNNER_TEMP/gitops-tools/psa-check" .
      - run: python -m pip install PyYAML==6.0.3
      - run: |
          bash scripts/install-validation-tools.sh "$RUNNER_TEMP/gitops-tools"
          echo "$RUNNER_TEMP/gitops-tools" >> "$GITHUB_PATH"
      - run: bash -n image-security/scan-image.sh
      - run: python image-security/test-image-security.py
      - run: python scripts/test-validate-gitops.py
      - run: python scripts/test-pod-security.py
      - run: python scripts/test-workload-hardening.py
      - run: python scripts/test-database-hardening.py
      - run: python scripts/test-argocd-bootstrap.py
      - run: python scripts/test-argocd-image-promotion.py
      - run: python scripts/test-argocd-api-candidate.py
      - run: python scripts/test-argocd-self-management.py
      - run: python scripts/test-argocd-projects.py
      # Private candidate pulls use short-lived ACR credentials on trusted main.
      # PR/branch validation remains credential-free; main always runs the image check.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        if: github.ref == 'refs/heads/main'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name prodacr1234 --only-show-errors
        if: github.ref == 'refs/heads/main'
      - run: python scripts/check-ksops-image.py
        if: github.ref == 'refs/heads/main'
      - name: Verify complete control-plane image pair
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update && sudo apt-get install -y age
          python3 - <<'PY'
          import subprocess, yaml
          values = yaml.safe_load(open('argocd-ksops-values.yaml'))
          image = values['global']['image']
          argo = image['repository'] + ':' + image['tag']
          ksops = next(c['image'] for c in values['repoServer']['initContainers'] if c['name'] == 'install-ksops')
          subprocess.run(['bash', 'argocd-images/test-runtime.sh', argo, ksops], check=True, timeout=300)
          PY
      - run: python scripts/test-network-policy.py
      - run: python scripts/test-operator-identity.py
      - run: python scripts/test-security-audit.py
      - run: go build -o "$RUNNER_TEMP/kubelet-storage-probe" tools/kubelet-storage-probe/main.go
      - run: python scripts/test-workload-identity.py
      - run: python scripts/test-postgres-upgrade.py
      - run: python scripts/validate-gitops.py
  promote:
    name: Promote validated production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Advance production to the validated commit
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main production
          # A newer intake commit will get its own run. Never promote stale work.
          if [ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]; then
            echo 'Superseded by a newer main commit; leaving production unchanged.'
            exit 0
          fi
          git merge-base --is-ancestor origin/production "$VALIDATED_SHA"
          git push origin "$VALIDATED_SHA:refs/heads/production"
